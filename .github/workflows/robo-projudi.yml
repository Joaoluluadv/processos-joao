name: Robô do Projudi

on:
  schedule:
    # A cada hora, 11h-22h UTC (8h-19h em Brasília), dias úteis.
    # ~12 execuções/dia úteis × ~22 dias/mês × ~3min ≈ 800min/mês — bem dentro
    # do limite gratuito de 2.000min/mês. Ajuste os horários/dias abaixo se
    # quiser mais ou menos frequência.
    - cron: '0 11-22 * * 1-5'
  workflow_dispatch: {}

jobs:
  atualizar:
    runs-on: ubuntu-latest
    # O robô só envia os dados no fim, depois de ler todos os processos: se o
    # job for cortado no meio, a rodada inteira se perde. Processo grande (1069
    # movimentos, 500 por página) pode demorar bastante para a aba carregar,
    # então a margem aqui é folgada de propósito. Não muda o gasto normal (~3min
    # por rodada) — é só o teto antes de o GitHub matar o job.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar dependências
        working-directory: robo-projudi
        run: npm install
      - name: Rodar robô
        working-directory: robo-projudi
        env:
          PROJUDI_URL: ${{ secrets.PROJUDI_URL }}
          PROJUDI_USUARIO: ${{ secrets.PROJUDI_USUARIO }}
          PROJUDI_SENHA: ${{ secrets.PROJUDI_SENHA }}
          PROJUDI_TOTP_SEGREDO: ${{ secrets.PROJUDI_TOTP_SEGREDO }}
          CODIGO_ESCRITORIO: ${{ secrets.CODIGO_ESCRITORIO }}
          ROBO_SEGREDO: ${{ secrets.ROBO_SEGREDO }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: node robo.js
